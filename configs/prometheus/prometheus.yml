global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'suricata'
    static_configs:
      - targets: ['10.10.10.24:9917']

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "snmp"
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [labmonitor_v2]

    static_configs:
      - targets:
          - 10.10.10.1
          - 10.10.10.23

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: 127.0.0.1:9116
